[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "irradium-core"
version = "0.3.0a1"
description = "IRRADIUM — An Integrated Framework for Irradiator Modeling, Simulation and Optimization"
requires-python = ">=3.11,<3.12"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
