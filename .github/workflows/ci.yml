name: Source checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m compileall -q app/src app/apps/api scripts
      - run: python -m unittest discover -s app/packaging/tests -p test_installation_lifecycle.py -v
      - run: python -m unittest discover -s app/packaging/tests -p test_storage_maintenance.py -v
      - run: bash -n install.sh uninstall.sh irradium scripts/install_runtime.sh scripts/package.sh
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: app/apps/web/package-lock.json
      - run: npm ci
        working-directory: app/apps/web
      - run: npx tsc --noEmit
        working-directory: app/apps/web
      - run: node tests/i18n.test.mjs
        working-directory: app/apps/web
      - run: npm run build
        working-directory: app/apps/web
